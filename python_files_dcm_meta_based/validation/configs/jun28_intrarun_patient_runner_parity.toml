schema_version = "validation_run_config_v1"
description = "Focused Jun28 intrarun validation: compare the single-shot patient-runner artifacts against the same run's legacy/oracle cohort output."

[defaults]
abs_tol = 1e-8
rel_tol = 1e-6
write_outputs = true
write_assembled_tables = true

[runs]
single_shot = "../Data/Output data/MC_sim_out- Date-Jun-28-2026 Time-00,49,13 - standard-run - inputs-dicom-500_mr-adc-0_mr-t2-0_rtdose-5_rtplan-5_rtstruct-5_us-5"

[paths]
single_shot_patient_runner = "../Data/Output data/MC_sim_out- Date-Jun-28-2026 Time-00,49,13 - standard-run - inputs-dicom-500_mr-adc-0_mr-t2-0_rtdose-5_rtplan-5_rtstruct-5_us-5/patient_scientific_runner"

[run_groups.intrarun_patient_runner_parity]
description = "Assemble completed patient-runner artifacts, then compare assembled cohort tables against the same run's legacy/oracle cohort output."
enabled = true

[[run_groups.intrarun_patient_runner_parity.jobs]]
name = "assemble_patient_runner_cohort"
script = "post_run_cohort_assembly"
patient_runner_output_path = "single_shot_patient_runner"

[[run_groups.intrarun_patient_runner_parity.jobs]]
name = "patient_runner_parity_vs_legacy"
script = "compare_patient_runner_parity"
legacy_output_run = "single_shot"
patient_runner_output_path = "single_shot_patient_runner"
output_dir = "validation_outputs/jun28_004913/patient_runner_parity"