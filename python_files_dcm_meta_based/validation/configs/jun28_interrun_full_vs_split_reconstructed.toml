schema_version = "validation_run_config_v1"
description = "Focused Jun28 interrun validation retained for historical triage only; disabled because the input folder was changed during split-run execution."

[defaults]
abs_tol = 1e-8
rel_tol = 1e-6

[paths]
full_patient_runner = "../Data/Output data/MC_sim_out- Date-Jun-28-2026 Time-00,49,13 - standard-run - inputs-dicom-500_mr-adc-0_mr-t2-0_rtdose-5_rtplan-5_rtstruct-5_us-5/patient_scientific_runner"
split_a_patient_runner = "../Data/Output data/MC_sim_out- Date-Jun-28-2026 Time-12,50,54 - standard-run - inputs-dicom-180_mr-adc-0_mr-t2-0_rtdose-2_rtplan-2_rtstruct-2_us-2/patient_scientific_runner"
split_b_patient_runner = "../Data/Output data/MC_sim_out- Date-Jun-28-2026 Time-13,25,09 - standard-run - inputs-dicom-320_mr-adc-0_mr-t2-0_rtdose-3_rtplan-3_rtstruct-3_us-3/patient_scientific_runner"

[run_groups.full_vs_split_reconstructed]
description = "Historical triage only: not a valid equivalence gate after the input folder changed during split-run execution."
enabled = false

[[run_groups.full_vs_split_reconstructed.jobs]]
name = "full_vs_split_reconstructed"
script = "compare_reconstructed_cohort_runs"
reference_patient_runner_output_path = "full_patient_runner"
split_patient_runner_outputs_paths = [
  "split_a_patient_runner",
  "split_b_patient_runner",
]
output_dir = "validation_outputs/jun28_004913/full_vs_split_reconstructed"